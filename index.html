<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

        <h1>Formulário de Casdatro</h1>

        <form onsubmit="enviar(event)">
    <div>
        <h3>Nome: </h3>
        <input type="text" id="nome">
    </div>

    <div>
        <h3>Endereço: </h3>
        <input type="text" id="endereco">
    </div>

    <div>
        <h3>CEP: </h3>
        <input type="text" 
        id="cep" 
        maxlength="10" 
        oninput="mascaraCEP()"
        placeholder="xx.xxx-xxx">
    </div>

    <div>
        <h3>CPF: </h3>
        <input type="text" id="cpf" 
        maxlength="14" 
        oninput="mascaraCPF()"
        placeholder="xxx.xxx.xxx-xx">
    </div>

    <div>
        <h3>Telefone: </h3>
        <input type="text" 
        id="telefone" 
        maxlength="19" 
        oninput="mascaraTelefone()"
        value="+55 ("
        placeholder="+55 (xx) x xxxx-xxxx">
    </div>

    <div>
        <h3>CNPJ: </h3>
        <input type="text" 
        id="cnpj"
        maxlength="18" 
        oninput="mascaraCNPJ()"
        placeholder="XX.XXX.XXX/XXXX-XX">

    </div>

        <br>

    <button type="submit">Enviar</button>

    </form>
</body>
</html>
